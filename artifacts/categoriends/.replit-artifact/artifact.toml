kind = "web"
previewPath = "/"
title = "Categoriends"
version = "1.0.0"
id = "artifacts/categoriends"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 24733

[services.development]
run = "pnpm --filter @workspace/categoriends run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/categoriends", "run", "build"]
publicDir = "artifacts/categoriends/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24733"
BASE_PATH = "/"
