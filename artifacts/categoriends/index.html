<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="description" content="Play Categoriends with friends! Name things in a category before time runs out. Solo, 1v1 duel, or party mode." />
    <meta name="keywords" content="category game, word game, multiplayer, trivia, party game, online game, kelime oyunu, kategori oyunu, çok oyunculu" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://categoriends.com/" />

    <!-- hreflang annotations — each language version has a stable crawlable URL -->
    <link rel="alternate" hreflang="x-default" href="https://categoriends.com/" />
    <link rel="alternate" hreflang="en" href="https://categoriends.com/en" />
    <link rel="alternate" hreflang="tr" href="https://categoriends.com/tr" />

    <!-- Open Graph -->
    <meta property="og:title" content="Categoriends - Online Category Game &amp; Words Trivia" />
    <meta property="og:description" content="Play Categoriends with friends! Name things in a category before time runs out. Solo, 1v1 duel, or party mode." />
    <meta property="og:image" content="https://categoriends.com/opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://categoriends.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Categoriends - Online Category Game &amp; Words Trivia" />
    <meta name="twitter:description" content="Play Categoriends with friends! Name things in a category before time runs out. Solo, 1v1 duel, or party mode." />

    <!-- Locale detection from URL path — runs after meta elements exist in DOM -->
    <script>
      (function () {
        var path = window.location.pathname;
        var isTr = path === "/tr" || path.startsWith("/tr/");
        var isEn = path === "/en" || path.startsWith("/en/");
        var lang = isTr ? "tr" : (isEn ? "en" : (localStorage.getItem("categoriends_lang") || "en"));

        var titles = {
          en: "Categoriends - Online Category Game & Words Trivia",
          tr: "Categoriends - Online Kategori Oyunu & Kelime Yarışması"
        };
        var descs = {
          en: "Play Categoriends with friends! Name things in a category before time runs out. Solo, 1v1 duel, or party mode.",
          tr: "Categoriends'i arkadaşlarınla oyna! Süre dolmadan kategorideki şeyleri say. Solo, 1v1 düello veya parti modu."
        };
        var locales = { en: "en_US", tr: "tr_TR" };
        var base = "https://categoriends.com";

        var canonicalPath = path.replace(/\/$/, "") || "/";

        document.title = titles[lang] || titles.en;
        document.documentElement.lang = lang;

        function setMeta(sel, attr, val) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute(attr, val);
        }

        setMeta('meta[name="description"]', "content", descs[lang] || descs.en);
        setMeta('meta[property="og:title"]', "content", titles[lang] || titles.en);
        setMeta('meta[property="og:description"]', "content", descs[lang] || descs.en);
        setMeta('meta[property="og:locale"]', "content", locales[lang] || locales.en);
        setMeta('meta[property="og:url"]', "content", base + canonicalPath);
        setMeta('meta[name="twitter:title"]', "content", titles[lang] || titles.en);
        setMeta('meta[name="twitter:description"]', "content", descs[lang] || descs.en);
        setMeta('link[rel="canonical"]', "href", base + canonicalPath);
      })();
    </script>

    <!-- Structured data — JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://categoriends.com/#website",
          "name": "Categoriends",
          "alternateName": "Categoriends - Muhteşem Kelime Savaşları",
          "url": "https://categoriends.com/",
          "description": "Play Categoriends with friends! Name things in a category before time runs out. Solo, 1v1 duel, or party mode.",
          "inLanguage": ["en", "tr"],
          "image": "https://categoriends.com/opengraph.jpg"
        },
        {
          "@type": "VideoGame",
          "@id": "https://categoriends.com/#game",
          "name": "Categoriends",
          "url": "https://categoriends.com/",
          "description": "Real-time multiplayer category word game. Players take turns naming things in a category before the timer runs out. Play solo, 1v1 duel, or party mode with friends.",
          "genre": ["Word Game", "Party Game", "Trivia"],
          "gamePlatform": "Web browser",
          "numberOfPlayers": {
            "@type": "QuantitativeValue",
            "minValue": 1,
            "maxValue": 20
          },
          "playMode": ["MultiPlayer", "SinglePlayer"],
          "applicationCategory": "Game",
          "operatingSystem": "Any",
          "inLanguage": ["en", "tr"],
          "isAccessibleForFree": true,
          "image": "https://categoriends.com/opengraph.jpg",
          "publisher": {
            "@type": "Organization",
            "name": "Categoriends",
            "url": "https://categoriends.com/"
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
