<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Dynamic title/lang before React hydrates — bots & first paint get the right value -->
    <script>
      (function () {
        var lang = localStorage.getItem("categoriends_lang") || "en";
        var titles = {
          en: "Categoriends - Online Category Game & Words Trivia",
          tr: "Categoriends - Online Kategori Oyunu & Kelime Yarışması"
        };
        document.title = titles[lang] || titles.en;
        document.documentElement.lang = lang;
      })();
    </script>

    <meta name="description" content="Categoriends: Fun online games to play with friends! En iyi İngilizce kelime oyunu ve category game deneyimi. Arkadaşlarınla 4 kişilik oyun kur ve yarış!" />
    <meta name="keywords" content="category game, word game, multiplayer, trivia, party game, online game, kelime oyunu, kategori oyunu, çok oyunculu" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://categoriends.replit.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Categoriends - Online Category Game & Words Trivia" />
    <meta property="og:description" content="Categoriends: Fun online games to play with friends! En iyi İngilizce kelime oyunu ve category game deneyimi. Arkadaşlarınla 4 kişilik oyun kur ve yarış!" />
    <meta property="og:image" content="https://categoriends.replit.app/opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://categoriends.replit.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Categoriends - Online Category Game & Words Trivia" />
    <meta name="twitter:description" content="Categoriends: Fun online games to play with friends! En iyi İngilizce kelime oyunu ve category game deneyimi. Arkadaşlarınla 4 kişilik oyun kur ve yarış!" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
